<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>4me Teknisyen Mobil Panel</title>
<style>
:root{--bg:#f5f7fb;--fg:#0f2740;--line:#e5e7eb;--muted:#6b7280;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#0b1220}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:16px;color:#0f2740;font-weight:700}
.who{font-size:12px;color:#374151}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.success{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn.blue{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
.btn.red{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
.wrap{padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 6px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.status{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.s-assigned{background:#fff7ed;color:#b45309;border-color:#fcd34d}
.s-accepted{background:#f0fdf4;color:#15803d;border-color:#86efac}
.s-in_progress{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd}
.meta{font-size:12px;color:#6b7280}
.title{font-size:15px;font-weight:700;margin:6px 0;color:#0b1220}
.sub{font-size:13px;color:#374151;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.detail{display:none;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:#fafcff}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;resize:vertical;background:#fff}
.detail-actions{display:flex;gap:8px;margin-top:8px}
.empty{padding:20px;text-align:center;color:#6b7280}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:14px;background:#0a7c2f;color:#fff;
  padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.18);opacity:0;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
#loginModal{position:fixed;top:0;left:0;width:100%;height:100%;
  backdrop-filter:blur(10px);background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;z-index:999;visibility:hidden;opacity:0;transition:.3s}
#loginModal.show{visibility:visible;opacity:1}
.modal-box{background:#fff;padding:20px;border-radius:14px;max-width:90%;width:360px;text-align:left}

/* 🔔 Yeni gelen "Atandı" kayıtlarının yanıp sönmesi */
@keyframes alertBlink {
  0%, 100% { background:#fee2e2; }
  50% { background:#ef4444; color:#fff; }
}
.blink-new {
  animation: alertBlink 1.1s ease-in-out infinite;
  border-color:#ef4444 !important;
}
</style>
</head>
<body>
<header>
  <h1>4me Teknisyen Paneli</h1>
  <div class="who" id="whoBox"></div>
  <div style="display:flex;gap:8px">
    <button id="refreshBtn" class="btn ghost">Yenile</button>
    <button id="logoutBtn" class="btn red">Çıkış</button>
  </div>
</header>

<div class="toolbar">
  <input id="searchInput" class="input" type="search" placeholder="Konu içinde ara..." />
  <select id="statusFilter">
    <option value="" selected>Hepsi</option>
    <option value="assigned">Atandı</option>
    <option value="accepted">Kabul Edildi</option>
    <option value="in_progress">Devam Ediyor</option>
  </select>
</div>

<div id="list" class="wrap"><div class="empty">Yükleniyor…</div></div>
<div id="toast" class="toast"></div>
<audio id="notifSound" src="notify.mp3" preload="auto"></audio>

<div id="loginModal" class="modal">
  <div class="modal-box">
    <h2>Giriş</h2>
    <p>Ad Soyad gir, ekibini seç.</p>
    <input id="nameInput" class="input" placeholder="Ad Soyad" style="margin-bottom:10px">
    <select id="teamSelect" class="input"><option value="">Ekip seçiniz…</option></select>
    <div style="text-align:right;margin-top:12px">
      <button id="loginBtn" class="btn blue">Devam</button>
    </div>
  </div>
</div>

<script>
const TOKEN="diRr9WNCk7ncGJvNj34bynuoaqvm2XzWuvhuclMWDdGcSVpzEdC1q2Bz3XAAma4mpd4y9IHeQk0vSk1csDf4d6RE3dASO6qK47uafWc5GFJNqOhq";
const ACCOUNT="tav-adb";
const API="https://api.4me.com/v1";
const CORS="https://cors-anywhere.herokuapp.com/";
const headersGet={"Authorization":"Bearer "+TOKEN,"Accept":"application/json","X-Xurrent-Account":ACCOUNT};
const headersPatch={...headersGet,"Content-Type":"application/json"};

let DATA=[],initialLoaded=false,refreshTimer=null,isRefreshing=false;
const LS_NAME="tech_name",LS_TEAM="tech_team",LS_NOTES="local_notes";
const SEEN=new Map();
let NEW_ASSIGNED=new Set();

function playSound(){
  const s=document.getElementById("notifSound");
  s.currentTime=0;
  s.play().catch(()=>{});
}

function toast(m,ok=true){const t=document.getElementById("toast");t.textContent=m;t.style.background=ok?"#0a7c2f":"#9b1c1c";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
function fmtDate(s){try{return new Date(s).toLocaleString("tr-TR");}catch{return s||"";}}
function statusBadge(s){const map={assigned:["Atandı","s-assigned"],accepted:["Kabul Edildi","s-accepted"],in_progress:["Devam Ediyor","s-in_progress"]};const [l,c]=map[s]||[s,""];return `<span class="status ${c}">${l}</span>`;}
function getUser(){return {name:localStorage.getItem(LS_NAME)||"",team:localStorage.getItem(LS_TEAM)||""};}
function setUser(n,t){localStorage.setItem(LS_NAME,n);localStorage.setItem(LS_TEAM,t);paintWho();}
function clearUser(){localStorage.removeItem(LS_NAME);localStorage.removeItem(LS_TEAM);paintWho();}
function show(el,on=true){el.classList.toggle("show",on);}
function paintWho(){const b=document.getElementById("whoBox");const u=getUser();b.textContent=u.name&&u.team?`${u.name} • ${u.team}`:"";}
function getLocalNotes(){try{return JSON.parse(localStorage.getItem(LS_NOTES)||"{}");}catch{return {};} }
function saveLocalNotes(n){localStorage.setItem(LS_NOTES,JSON.stringify(n));}

/* --- İş Tipi filtreleme: yalnızca Arıza, Talep/İstek, Aydınlatma --- */
function isAllowedJob(req) {
  const lc = s => String(s || "").toLowerCase();
  const candidates = [
    lc(req.category),
    lc(req.category_label),
    lc(req.request_type),
    lc(req.request_type_label),
    lc(req.subject)
  ];
  if (Array.isArray(req.custom_fields)) {
    for (const f of req.custom_fields) {
      const v = lc(f.value || "");
      const id = lc(f.id || "");
      const label = lc(f.label || "");
      if (id.includes("iş") || label.includes("iş") || id.includes("type") || label.includes("type"))
        candidates.push(v);
    }
  }
  const ALLOWED = ["arıza", "talep", "istek", "aydınlatma"];
  const joined = candidates.join(" ");
  if (ALLOWED.some(w => joined.includes(w))) return true;
  return false;
}

/* === API === */
async function fetchRequests(){
  const r=await fetch(`${CORS}${API}/requests?per_page=100`,{headers:headersGet});
  if(!r.ok)throw new Error("HTTP "+r.status);
  let d=await r.json();
  if(!Array.isArray(d)) d=[];
  d = d.filter(x => isAllowedJob(x));
  return d;
}

async function patchRequest(id,body){
  const r=await fetch(`${CORS}${API}/requests/${id}`,{method:"PATCH",headers:headersPatch,body:JSON.stringify(body)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
}

async function safeRefresh(){
 if(isRefreshing) return;
 if(document.querySelector(".detail[style*='block']")) return;
 isRefreshing=true;
 try{
   const fresh=await fetchRequests();
   if(SEEN.size===0){
     fresh.forEach(r=>SEEN.set(r.id,r.status));
     NEW_ASSIGNED=new Set();
   }else{
     const newly=[];
     for(const r of fresh){
       const prev=SEEN.get(r.id);
       if(r.status==="assigned" && prev!=="assigned") newly.push(r.id);
     }
     NEW_ASSIGNED=new Set(newly);
     if(NEW_ASSIGNED.size>0) playSound();
     SEEN.clear();
     fresh.forEach(r=>SEEN.set(r.id,r.status));
   }
   DATA=fresh;
   mergeLocalNotes();
   if(!initialLoaded){fillTeams();initialLoaded=true;}
   renderList();
 }catch(e){toast("Yenileme hatası",false);}
 finally{isRefreshing=false;}
}

function mergeLocalNotes(){
 const notes=getLocalNotes();
 for(const r of DATA){
   if(notes[r.id]){
     const f=(r.custom_fields||[]).find(x=>x.id==="work_desc");
     if(f)f.value=notes[r.id];else (r.custom_fields||=[]).push({id:"work_desc",value:notes[r.id]});
   }
 }
}

async function loadFirst(){await safeRefresh();const u=getUser();show(document.getElementById("loginModal"),!(u.name&&u.team));}

function fillTeams(){
 const s=document.getElementById("teamSelect");
 const teams=[...new Set(DATA.map(r=>r.team?.name).filter(Boolean))].sort();
 s.innerHTML='<option value="">Ekip seçiniz…</option>'+teams.map(t=>`<option value="${t}">${t}</option>`).join("");
}

function renderList(){
 const q=document.getElementById("searchInput").value.toLowerCase();
 const f=document.getElementById("statusFilter").value;
 const list=document.getElementById("list");
 const u=getUser();
 let items=DATA.filter(r=>(!u.team||(r.team?.name||"")===u.team));
 if(q)items=items.filter(r=>(r.subject||"").toLowerCase().includes(q));
 if(f)items=items.filter(r=>r.status===f);
 const order={assigned:1,accepted:2,in_progress:3};
 items.sort((a,b)=>(order[a.status]||9)-(order[b.status]||9));
 if(!items.length){list.innerHTML='<div class="empty">Kayıt yok.</div>';return;}
 const frag=document.createDocumentFragment();
 for(const r of items){
   const note=(r.custom_fields||[]).find(x=>x.id==="work_desc")?.value||"";
   const assignee=r.assigned_to?.name||r.assigned_to?.email||"Belirtilmemiş";
   const card=document.createElement("div");
   card.className="card";
   card.setAttribute("data-id-card",String(r.id));
   if(NEW_ASSIGNED.has(r.id)){
     card.classList.add("blink-new");
     setTimeout(()=>{const el=document.querySelector(`[data-id-card='${r.id}']`);el&&el.classList.remove("blink-new");},15000);
   }
   card.innerHTML=`
     <div class="row1"><div>${statusBadge(r.status)} <span class="meta">${fmtDate(r.created_at)}</span></div><div class="meta">#${r.id}</div></div>
     <div class="title">${r.team?.name||""}<span class="tag">${r.service_instance?.name||""}</span></div>
     <div class="sub">${r.subject||""}\n👤 Atanan Kişi: ${assignee}\n${note?`\n🧾 ${note}`:""}\n👷‍♂️ ${u.name}</div>
     <div class="actions">
       <button class="btn success" data-act="accept" data-id="${r.id}">Kabul Et</button>
       <button class="btn blue" data-act="detail" data-id="${r.id}">Açıklama Ekle</button>
     </div>
     <div class="detail" id="detail-${r.id}">
       <textarea id="note-${r.id}" placeholder="Yeni açıklama ekle..."></textarea>
       <div class="detail-actions">
         <button class="btn blue" data-act="save" data-id="${r.id}">Kaydet</button>
         <button class="btn ghost" data-act="close" data-id="${r.id}">Kapat</button>
       </div>
     </div>`;
   frag.appendChild(card);
 }
 list.replaceChildren(frag);
}

document.getElementById("refreshBtn").onclick=()=>safeRefresh();
document.getElementById("logoutBtn").onclick=()=>{clearUser();show(document.getElementById("loginModal"),true);};
document.getElementById("searchInput").oninput=()=>renderList();
document.getElementById("statusFilter").onchange=()=>renderList();
document.getElementById("loginBtn").onclick=()=>{
 const n=document.getElementById("nameInput").value.trim();
 const t=document.getElementById("teamSelect").value;
 if(!n)return toast("Ad soyad gir",false);
 if(!t)return toast("Ekip seç",false);
 setUser(n,t);show(document.getElementById("loginModal"),false);renderList();
 if(refreshTimer)clearInterval(refreshTimer);
 refreshTimer=setInterval(()=>safeRefresh(),10000);
};

paintWho();
loadFirst();
</script>
</body>
</html>
