name: 4me Data Sync

on:
  schedule:
    - cron: "*/5 * * * *"   # Her 5 dakikada bir
  workflow_dispatch:         # Manuel çalıştırma için

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from 4me API
        env:
          TOKEN: ${{ secrets.FOURME_TOKEN }}
          ACCOUNT: "tav-adb"
        run: |
          echo "Veri çekiliyor..."
          curl -s -H "Authorization: Bearer $TOKEN" \
               -H "X-Xurrent-Account: $ACCOUNT" \
               "https://api.4me.com/v1/requests?per_page=100" \
          | jq '.' > data.json
          echo "Veri kaydedildi."

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update data.json" || echo "No changes"
          git push
