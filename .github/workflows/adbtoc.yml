name: 4me Data Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from 4me API
        env:
          TOKEN: ${{ secrets.FOURME_TOKEN }}
          ACCOUNT: "tav-adb"
        run: |
          echo "4me API'den veri çekiliyor..."
          RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
                           -H "X-Xurrent-Account: $ACCOUNT" \
                           "https://api.4me.com/v1/requests?per_page=100")
          echo "$RESPONSE" | jq ".requests" > data.json
          echo "data.json oluşturuldu."

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update data.json" || echo "No changes"
          git push
