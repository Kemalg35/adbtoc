name: 4me Data Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate or fetch real 4me data
        env:
          TOKEN: ${{ secrets.FOURME_TOKEN }}
          ACCOUNT: "tav-adb"
        run: |
          echo "Veri çekiliyor..."
          curl -s -H "Authorization: Bearer $TOKEN" \
               -H "X-Xurrent-Account: $ACCOUNT" \
               "https://api.4me.com/v1/requests?per_page=100" > full_raw.json

          # Eğer response kısaltılmışsa (… içeriyorsa), örnek boş liste üret
          if grep -q "\.\.\." full_raw.json; then
            echo "Gerçek veri yok, dummy format yazılıyor"
            echo '[]' > data.json
          else
            cat full_raw.json | sed -n '/"requests": \[/,/\]/{/"requests": \[/d;/\]/d;p;}' | sed '1s/^/[/' | sed '$s/$/]/' > data.json
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "update data.json" || echo "no changes"
          git push
