<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>4me Teknisyen Panel</title>
<style>
  :root{--bg:#f5f7fb;--fg:#0f2740;--line:#e5e7eb;--muted:#6b7280;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--fg)}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:16px;color:var(--fg);font-weight:700}
  .btn{appearance:none;border:0;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
  .btn.ghost{background:#fff;border:1px solid var(--line)}
  .wrap{padding:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 6px;
    box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .title{font-size:15px;font-weight:700;margin:6px 0;color:#0b1220}
  .meta{font-size:13px;color:#374151;margin-top:4px}
  .empty{padding:20px;text-align:center;color:#6b7280}
  @keyframes blink {
    0%,50%,100%{background-color:#fff7ed}
    25%,75%{background-color:#f87171}
  }
  .blink{animation:blink 1.5s infinite}
</style>
</head>
<body>
<header>
  <h1>4me Teknisyen Paneli</h1>
  <button id="refreshBtn" class="btn ghost">Yenile</button>
</header>

<div id="list" class="wrap"><div class="empty">Yükleniyor…</div></div>

<script>
const API = "https://raw.githubusercontent.com/Kemalg35/adbtoc/main/data.json";
let DATA = [];

async function fetchData(){
  const list = document.getElementById("list");
  try {
    const r = await fetch(API + "?t=" + Date.now());
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if(!Array.isArray(d)) throw new Error("Geçersiz JSON");
    DATA = d;
    renderList();
  } catch(e){
    list.innerHTML = "<div class='empty'>Veri yüklenemedi: "+e.message+"</div>";
  }
}

function renderList(){
  const list = document.getElementById("list");
  if(!DATA.length){
    list.innerHTML = "<div class='empty'>Kayıt bulunamadı.</div>";
    return;
  }
  const frag = document.createDocumentFragment();
  for(const r of DATA){
    const card = document.createElement("div");
    card.className = "card";
    if(r.status === "assigned") card.classList.add("blink");
    card.innerHTML = `
      <div class="title">${r.subject || "Konu Yok"}</div>
      <div class="meta">Ekip: ${r.team?.name || "Bilinmiyor"}</div>
      <div class="meta">Durum: ${r.status || "-"}</div>
      <div class="meta">Tarih: ${new Date(r.created_at).toLocaleString("tr-TR")}</div>
    `;
    frag.appendChild(card);
  }
  list.replaceChildren(frag);
}

document.getElementById("refreshBtn").onclick = fetchData;
fetchData();
setInterval(fetchData, 300000); // 5 dakikada bir yenile
</script>
</body>
</html>
